name: reusable-changelog
# Reusable CHANGE-TRACKING component. Language-neutral — every team calls this one.
on:
  workflow_call:
    inputs:
      history-count: { type: number, default: 20 }
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        run: |
          echo "# Changelog"                             >  CHANGELOG_LATEST.md
          echo "Commit: ${{ github.sha }}"               >> CHANGELOG_LATEST.md
          echo "By: ${{ github.actor }}"                 >> CHANGELOG_LATEST.md
          echo ""                                        >> CHANGELOG_LATEST.md
          git log -${{ inputs.history-count }} --pretty=format:"- %s (%an, %ad)" --date=short >> CHANGELOG_LATEST.md
          echo "----- PREVIEW -----"; cat CHANGELOG_LATEST.md
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG_LATEST.md
