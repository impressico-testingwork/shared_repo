name: Lint (language-agnostic)
on:
  workflow_call:
    inputs:
      validate-all-codebase: { type: boolean, default: true, required: false }
      default-branch:        { type: string,  default: "main", required: false }
      runner:                { type: string,  default: "ubuntu-latest", required: false }
jobs:
  lint:
    runs-on: ${{ inputs.runner }}
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Super-Linter
        uses: super-linter/super-linter@v8
        env:
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate-all-codebase }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Setting any VALIDATE_* to true = allow-list mode:
          # only these run, everything else is skipped.
          VALIDATE_JAVASCRIPT_ES: true        # ESLint — real JS issues
          VALIDATE_DOCKERFILE_HADOLINT: true  # Dockerfile best practices
          VALIDATE_GITHUB_ACTIONS: true       # actionlint — workflow correctness
          VALIDATE_YAML: true                 # yamllint — real YAML errors
          VALIDATE_JSON: true                 # JSON validity

          # Stop the per-linter commit-status API calls (the harmless 403s).
          MULTI_STATUS: false
