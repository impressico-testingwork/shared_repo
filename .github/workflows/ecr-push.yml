name: ECR Push
# Loads the built image (via artifact), authenticates to AWS via OIDC,
# retags to the ECR URI, and pushes.
on:
  workflow_call:
    inputs:
      image-artifact:  { type: string,  required: true }
      image-ref:       { type: string,  required: true }
      aws-region:      { type: string,  required: true }
      role-arn:        { type: string,  required: true }
      ecr-repository:  { type: string,  required: true }
      ensure-ecr-repo: { type: boolean, default: false, required: false }
      runner:          { type: string,  default: "ubuntu-latest", required: false }
    outputs:
      image-uri:
        description: "Full image URI pushed to ECR."
        value: ${{ jobs.push.outputs.image-uri }}
jobs:
  push:
    runs-on: ${{ inputs.runner }}
    permissions:
      id-token: write        # AWS OIDC
      contents: read
    outputs:
      image-uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with: { name: "${{ inputs.image-artifact }}" }
      - name: Load image
        run: docker load -i image.tar
      - name: Ensure ECR repository exists
        if: ${{ inputs.ensure-ecr-repo }}
        run: |
          aws ecr describe-repositories --repository-names "${{ inputs.ecr-repository }}" --region "${{ inputs.aws-region }}" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "${{ inputs.ecr-repository }}" --image-scanning-configuration scanOnPush=true --region "${{ inputs.aws-region }}"
      - name: Tag, login & push
        id: push
        run: |
          set -euo pipefail
          TAG="${{ inputs.image-ref }}"; TAG="${TAG##*:}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
          IMAGE_URI="${REGISTRY}/${{ inputs.ecr-repository }}:${TAG}"
          docker tag "${{ inputs.image-ref }}" "$IMAGE_URI"
          aws ecr get-login-password --region "${{ inputs.aws-region }}" | docker login --username AWS --password-stdin "$REGISTRY"
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE_URI"
