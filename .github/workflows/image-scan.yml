name: Image Scan (Trivy)
# Loads the image built by docker-build (via its artifact) and scans it.
on:
  workflow_call:
    inputs:
      image-artifact:  { type: string, required: true }
      image-ref:       { type: string, required: true }
      trivy-severity:  { type: string, default: "CRITICAL", required: false }   # CHANGED: only CRITICAL
      trivy-exit-code: { type: string, default: "1", required: false }   # 1 = block; 0 = report
      runner:          { type: string, default: "ubuntu-latest", required: false }
jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    permissions: { contents: read }
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with: { name: "${{ inputs.image-artifact }}" }
      - name: Load image
        run: docker load -i image.tar
      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version
      - name: Scan image
        run: |
          trivy image --severity "${{ inputs.trivy-severity }}" \
            --exit-code "${{ inputs.trivy-exit-code }}" --ignore-unfixed --no-progress \
            "${{ inputs.image-ref }}"
