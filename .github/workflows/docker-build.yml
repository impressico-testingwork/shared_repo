name: Docker Build
# Builds the image, saves it to a tarball, and uploads it as an artifact so
# separate scan/push jobs (which run on different ephemeral runners) can load it.
on:
  workflow_call:
    inputs:
      image-name:
        description: "Local image name (no registry), e.g. the service name."
        type: string
        required: true
      image-tag:
        description: "Tag. Defaults to sha-<short commit>."
        type: string
        default: ""
        required: false
      dockerfile:    { type: string, default: "Dockerfile", required: false }
      build-context: { type: string, default: ".",          required: false }
      artifact-retention-days: { type: number, default: 1,  required: false }
      runner:        { type: string, default: "ubuntu-latest", required: false }
    outputs:
      image-ref:
        description: "Local image reference (name:tag) that scan/push load."
        value: ${{ jobs.build.outputs.image-ref }}
      image-tag:
        description: "Resolved tag."
        value: ${{ jobs.build.outputs.image-tag }}
      image-artifact:
        description: "Artifact name holding the saved image tarball."
        value: ${{ jobs.build.outputs.image-artifact }}
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions: { contents: read }
    outputs:
      image-ref:      ${{ steps.meta.outputs.image_ref }}
      image-tag:      ${{ steps.meta.outputs.image_tag }}
      image-artifact: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ inputs.image-tag }}"; [ -z "$TAG" ] && TAG="sha-${GITHUB_SHA::7}"
          echo "image_tag=$TAG"                                   >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ inputs.image-name }}:$TAG"          >> "$GITHUB_OUTPUT"
          echo "artifact_name=image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: docker build -f "${{ inputs.dockerfile }}" -t "${{ steps.meta.outputs.image_ref }}" "${{ inputs.build-context }}"
      - name: Save image to tarball
        run: docker save "${{ steps.meta.outputs.image_ref }}" -o image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: image.tar
          retention-days: ${{ inputs.artifact-retention-days }}
