name: CI/CD (orchestrator)
on:
  workflow_call:
    inputs:
      aws-region:      { type: string,  required: true }
      role-arn:        { type: string,  required: true }
      ecr-repository:  { type: string,  required: true }
      image-tag:       { type: string,  required: false, default: "" }
      dockerfile:      { type: string,  required: false, default: "Dockerfile" }
      build-context:   { type: string,  required: false, default: "." }
      trivy-severity:  { type: string,  required: false, default: "CRITICAL,HIGH" }
      trivy-exit-code: { type: string,  required: false, default: "1" }
      ensure-ecr-repo: { type: boolean, required: false, default: false }
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  security:
    uses: ./.github/workflows/security-checks.yml
  build-scan-push:
    needs: [lint, security]        # build only if lint + security pass
    uses: ./.github/workflows/build-scan-push.yml
    with:
      aws-region:      ${{ inputs.aws-region }}
      role-arn:        ${{ inputs.role-arn }}
      ecr-repository:  ${{ inputs.ecr-repository }}
      image-tag:       ${{ inputs.image-tag }}
      dockerfile:      ${{ inputs.dockerfile }}
      build-context:   ${{ inputs.build-context }}
      trivy-severity:  ${{ inputs.trivy-severity }}
      trivy-exit-code: ${{ inputs.trivy-exit-code }}
      ensure-ecr-repo: ${{ inputs.ensure-ecr-repo }}
