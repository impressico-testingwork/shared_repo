name: reusable-package-python
# Reusable PACKAGE component for the Python toolchain.
on:
  workflow_call:
    inputs:
      python-version:    { type: string, default: "3.12" }
      working-directory: { type: string, default: "." }
      artifact-name:     { type: string, default: "app-package" }
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Build package
        run: mkdir -p dist && cp -r src dist/ && echo "[build] artifact in dist/"
        working-directory: ${{ inputs.working-directory }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist
