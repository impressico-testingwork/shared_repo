name: Build, Scan & Push (ECR)
on:
  workflow_call:
    inputs:
      aws-region:      { type: string,  required: true }
      role-arn:        { type: string,  required: true }
      ecr-repository:  { type: string,  required: true }
      image-tag:       { type: string,  required: false, default: "" }
      dockerfile:      { type: string,  required: false, default: "Dockerfile" }
      build-context:   { type: string,  required: false, default: "." }
      trivy-severity:  { type: string,  required: false, default: "CRITICAL,HIGH" }
      trivy-exit-code: { type: string,  required: false, default: "1" }
      ensure-ecr-repo: { type: boolean, required: false, default: false }
      runner:          { type: string,  required: false, default: "ubuntu-latest" }
    outputs:
      image-uri: { value: "${{ jobs.build-scan-push.outputs.image-uri }}" }
jobs:
  build-scan-push:
    runs-on: ${{ inputs.runner }}
    permissions: { id-token: write, contents: read }   # id-token = OIDC
    outputs:
      image-uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
      - name: Resolve image metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ inputs.image-tag }}"; [ -z "$TAG" ] && TAG="sha-${GITHUB_SHA::7}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
          echo "registry=$REGISTRY"                                   >> "$GITHUB_OUTPUT"
          echo "image_uri=${REGISTRY}/${{ inputs.ecr-repository }}:${TAG}" >> "$GITHUB_OUTPUT"
      - name: Ensure ECR repository exists
        if: ${{ inputs.ensure-ecr-repo }}
        run: |
          aws ecr describe-repositories --repository-names "${{ inputs.ecr-repository }}" \
              --region "${{ inputs.aws-region }}" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "${{ inputs.ecr-repository }}" \
                 --image-scanning-configuration scanOnPush=true --region "${{ inputs.aws-region }}"
      - name: Build image
        run: docker build -f "${{ inputs.dockerfile }}" -t "${{ steps.meta.outputs.image_uri }}" "${{ inputs.build-context }}"
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Scan image with Trivy (gate before push)
        run: |
          trivy image --severity "${{ inputs.trivy-severity }}" \
            --exit-code "${{ inputs.trivy-exit-code }}" --ignore-unfixed --no-progress \
            "${{ steps.meta.outputs.image_uri }}"
      - name: Login to ECR and push
        run: |
          aws ecr get-login-password --region "${{ inputs.aws-region }}" \
            | docker login --username AWS --password-stdin "${{ steps.meta.outputs.registry }}"
          docker push "${{ steps.meta.outputs.image_uri }}"
